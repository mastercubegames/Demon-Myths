<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Demon Myths — real fantasy demonlist</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
:root{
  --bg1:#150833; --bg2:#2b0e4d;
  --panel:rgba(255,255,255,0.055); --panel2:rgba(255,255,255,0.09);
  --line:rgba(255,255,255,0.14);
  --easy:#6da8ff; --med:#ffa04d; --hard:#ff5a5a; --insane:#ff4dd2; --extreme:#b44dff;
  --gold:#ffd24d; --text:#f3eefc; --dim:rgba(243,238,252,0.62); --live:#7dffa8;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Nunito',system-ui,sans-serif;
  background:radial-gradient(1200px 700px at 50% -10%, var(--bg2), var(--bg1) 60%);}
.display{font-family:'Titan One','Nunito',sans-serif;letter-spacing:.5px}
.mono{font-family:'JetBrains Mono',monospace}
a{color:var(--easy)}
.wrap{max-width:780px;margin:0 auto;padding:0 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.bigbtn{width:100%;padding:15px 18px;border-radius:16px;border:none;cursor:pointer;
  font-family:'Titan One',sans-serif;font-size:17px;letter-spacing:1px;color:#2a1200;
  background:linear-gradient(180deg,#ffe08a,var(--gold) 55%,#e0a92e);

@keyframes pulse{0%,100%{box-shadow:0 5px 0 #8a6510,0 0 0 0 rgba(255,210,77,.45)}50%{box-shadow:0 5px 0 #8a6510,0 0 0 12px rgba(255,210,77,0)}}

<body>
<div id="app"></div>
<script>
/* ==========================================================================
   DEMON MYTHS — REAL SCORING EDITION (GitHub Pages build)
   No simulation. Points come from things that actually happened:
     \u25CF pointercrate records feed  -> every approved list record by your players
     \u25CF pointercrate demons diff   -> a NEW level on the list = real First Victor
     \u25CF GDBrowser (GD Colon's API) -> demon count on their actual GD profile,
                                       routed through a public CORS relay because
                                       GDBrowser sends no CORS headers itself
   ========================================================================== */

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const sleep = (ms) => new Promise(res=>setTimeout(res,ms));
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const nowStr = () => new Date().toISOString().slice(0,16).replace('T',' ');
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

// ---------- storage (claude.ai window.storage OR localStorage when self-hosted) ----------
const store = {
  async get(k){ try{ if(window.storage){const r=await window.storage.get(k); return r&&r.value||null;} }catch(e){}
    try{ if(!window.storage && window.localStorage) return localStorage.getItem(k); }catch(e){} return null; },
  async set(k,v){ try{ if(window.storage){await window.storage.set(k,v); return;} }catch(e){}
    try{ if(!window.storage && window.localStorage) localStorage.setItem(k,v); }catch(e){} },
  async del(k){ try{ if(window.storage){await window.storage.delete(k); return;} }catch(e){}
    try{ if(!window.storage && window.localStorage) localStorage.removeItem(k); }catch(e){} },
};
const KEY_SAVE='dm3:save', KEY_DATA='dm3:data', KEY_MPCFG='dmmp:cfg', KEY_MPSES='dmmp:ses';

// ---------- constants ----------
const PC = 'https://pointercrate.com/api';
const GDB = 'https://gdbrowser.com/api';
const CPU_NAMES = ['Silent Clubsteppers','Fire In The Hole FC','Sakupen Circle Club','Nine Circles Nation','Acheron Athletics','Wave Riders','Free Solo FC','The Legacy List'];
const MEMES = ['raw footage or it didn\u2019t happen','the #1 spot is temporary by design','list editors are typing\u2026','every point on this board actually happened','fire in the hole \uD83D\uDD25\uD83D\uDD73\uFE0F'];

const SNAPSHOT = {
  source:'snapshot', updated:'2026-08 (built-in snapshot)',
  players:['Zoink','Trick','wPopoff','Doggie','Cursed','Thnnder','Technical','BGram','SpaceUK','Vision','Wespdx','Maxfs','Paqoe','Kori','VoTcHi','Skulzi','Diamond','OmegaFalcon','SrGuillester','Rampage','Luqualizer','Dorami','Juniper','npesta','Sunix','Riot','KrmaL','Combined','GuitarHeroStyles','EricVanWilderman']
    .map((n,i)=>({rank:i+1,name:n,score:null,country:''})),
  demons:['Society','Thinking Space II','Flamewall','Amethyst','Tidal Wave','ORBIT','Acheron','Avernus','Kocmoc','Silent clubstep','Slaughterhouse','Abyss of Darkness','Tunnel of Despair','Sakupen Circles','Arcturus','Oblivion','Codependence','Grief','LIMBO','Hard Machine']
    .map((n,i)=>({position:i+1,name:n,verifier:''})),
  watch:[{player:'community',level:'Silent Acropolis',note:'upcoming top-1 project'},{player:'community',level:'Ascension to Heaven',note:'upcoming top-1 candidate'}],
};

// ---------- global state ----------
let DATA = null;           // {source, updated, players[], demons[], watch[]}
let game = null;
let tab = 'league';
let bootLog = [];
let confirmReset = false;
let expandRow = null;
let boardShown = 25;
let dropSel = null;
let editGd = null;         // pid whose GD name is being edited
let syncing = false;
let syncMsg = '';
let mode = 'solo';         // 'solo' | 'multi'
let soloGameCache = null;  // parked solo league while in friends mode
let MP = null;             // {url, key} supabase config
let mpSession = null;      // {leagueId, memberId, username}
let mpRev = 0;             // league row revision (optimistic concurrency)
let mpScreen = 'connect';  // connect|home|create|join|login
let mpLoading = false;
let mpStatus = '';
let mpLoginPickId = null;
let tradeDraft = null;     // {toSlot, give:[], get:[]}
let syncDelta = null;      // capture of sync results for conflict-safe merge

// ---------- fetch layer ----------
async function tryFetchRaw(url, ms, opts){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms||8000);
  try{
    const init = {signal:c.signal, headers: Object.assign({'Accept':'application/json'}, (opts&&opts.headers)||{})};
    if(opts&&opts.method) init.method = opts.method;
    if(opts&&opts.body!==undefined){ init.body = JSON.stringify(opts.body); init.headers['Content-Type']='application/json'; }
    const res = await fetch(url, init);
    clearTimeout(t);
    let link = null; try{ link = res.headers && res.headers.get && res.headers.get('Link'); }catch(e){}
    if(!res.ok) return {json:null, link:link, status:res.status};
    let j = null; try{ j = await res.json(); }catch(e){ j = null; }
    return {json:j, link:link, status:res.status};
  }catch(e){ clearTimeout(t); return {json:null, link:null, status:0}; }
}
async function tryFetchJSON(url, ms){ return (await tryFetchRaw(url,ms)).json; }

async function loadFromAPI(){
  const players = await tryFetchJSON(PC+'/v1/players/ranking/?limit=100');
  if(!players || !Array.isArray(players) || players.length===0) return null;
  let demons = await tryFetchJSON(PC+'/v2/demons/listed?limit=100');
  if(demons && demons.data) demons = demons.data;
  if(!Array.isArray(demons)) demons = [];
  return {
    source:'api', updated:nowStr(),
    players: players.map((p,i)=>({rank:p.rank||i+1, name:p.name||('player '+(i+1)),
      score:(typeof p.score==='number')?Math.round(p.score*10)/10:null,
      country:(p.nationality&&(p.nationality.country_code||p.nationality.nation))||''})),
    demons: demons.map(d=>({position:d.position, name:d.name, verifier:(d.verifier&&d.verifier.name)||''})),
    watch: (DATA&&DATA.watch)||[],
  };
}

async function bootData(skipCache){
  bootLog=[]; renderBoot();
  const log = (s)=>{ bootLog.push(s); renderBoot(); };
  log('connecting to pointercrate API\u2026');
  const api = await loadFromAPI();
  if(api){ log('\u25CF LIVE \u2014 top '+api.players.length+' straight from the List'); DATA=api;
    await store.set(KEY_DATA, JSON.stringify(api)); return; }
  log('pointercrate unreachable \u2014 check your connection');
  if(!skipCache){
    try{ const raw = await store.get(KEY_DATA);
      if(raw){ const c=JSON.parse(raw); if(c&&c.players&&c.players.length){ log('using last saved data ('+c.updated+')'); DATA=c; return; } }
    }catch(e){}
  }
  log('falling back to built-in snapshot');
  DATA = SNAPSHOT;
}

// ---------- player + scoring model ----------
function tierFor(rank){
  if(rank<=10) return {key:'EXTREME', hex:'#b44dff'};
  if(rank<=30) return {key:'INSANE',  hex:'#ff4dd2'};
  if(rank<=60) return {key:'HARD',    hex:'#ff5a5a'};
  if(rank<=85) return {key:'MEDIUM',  hex:'#ffa04d'};
  return {key:'EASY', hex:'#6da8ff'};
}
function mkPlayer(entry){
  return { id:'r'+entry.rank+'_'+entry.name, name:entry.name, rank:entry.rank, score:entry.score, country:entry.country,
    pts:0, gdName:entry.name, gdDemons:null, gdStatus:null };
}
const draftValue = (p)=> Math.round(clamp(99-(p.rank-1)*0.36,62,99));

// real-event scoring table
function scoreRecord(position, progress){
  if(progress>=100){
    if(position==null) return 25;
    if(position<=10) return 60;
    if(position<=75) return 25;
    if(position<=150) return 12;
    return 6;
  }
  if(position!=null && position<=75) return Math.round(progress/6);
  return 0;
}
const FIRST_VICTOR_PTS = 140;
const GD_DEMON_PTS = 4;

// ---------- links ----------
const linkTwitch = (n)=>'https://www.twitch.tv/search?term='+encodeURIComponent(n);
const linkYT = (n)=>'https://www.youtube.com/results?search_query='+encodeURIComponent(n+' geometry dash');
const linkYTLive = (n)=>'https://www.youtube.com/results?search_query='+encodeURIComponent(n)+'&sp=EgJAAQ%3D%3D';
const linkGDB = (n)=>'https://gdbrowser.com/u/'+encodeURIComponent(n);
const LINK_PC = 'https://pointercrate.com/demonlist/statsviewer/';

// ---------- game setup ----------
async function persistGame(){ if(game && game.mode==='multi') return; try{ await store.set(KEY_SAVE, JSON.stringify(game)); }catch(e){} }
const gp = (id)=> game.players.find(p=>p.id===id);
function mySlot(){ if(!game) return -1;
  if(game.mode==='multi') return game.teams.findIndex(t=>t.ownerId===(mpSession&&mpSession.memberId));
  return game.userSlot; }
function isMine(t){ return (game&&game.mode==='multi') ? (t.ownerId===(mpSession&&mpSession.memberId)) : !!t.isUser; }
function ownerName(t){ if(!game||game.mode!=='multi'||!t.ownerId) return null;
  const m=(game.members||[]).find(x=>x.id===t.ownerId); return m?m.name:null; }
function faUsedToday(){ if(!game) return false;
  if(game.mode==='multi') return !!(game.faUsedOn && typeof game.faUsedOn==='object' && mpSession && game.faUsedOn[mpSession.memberId]===today());
  return game.faUsedOn===today(); }
function markFaUsed(){ if(game.mode==='multi'){ if(!game.faUsedOn||typeof game.faUsedOn!=='object') game.faUsedOn={}; if(mpSession) game.faUsedOn[mpSession.memberId]=today(); } else game.faUsedOn=today(); }
const deepClone = (o)=> JSON.parse(JSON.stringify(o));
function draftTurnLabel(myTurn){
  if(myTurn) return 'Your pick \u2014 tap a player';
  const t = game.teams[game.order[game.pickIdx]];
  if(game.mode==='multi'){ const nm = t ? ownerName(t) : null;
    return nm ? ('Waiting for '+nm+'\u2026 auto-refreshes') : 'CPU picking\u2026'; }
  return 'CPU thinking\u2026'; }
const rosteredPids = ()=> game.teams.flatMap(t=>t.roster);
function pidByName(name){
  const n = String(name||'').toLowerCase();
  const set = rosteredPids();
  for(const pid of set){ const p=gp(pid); if(p.name.toLowerCase()===n || (p.gdName||'').toLowerCase()===n) return pid; }
  return null;
}
function teamOf(pid){ return game.teams.find(t=>t.roster.includes(pid)); }

function startDraft(){
  const name = ($('nameInput') && $('nameInput').value.trim()) || 'My Squad';
  const src = DATA || SNAPSHOT;
  const poolPlayers = src.players.slice(0,40).map(mkPlayer);
  const userSlot = Math.floor(Math.random()*4);
  const cpu = [...CPU_NAMES].sort(()=>Math.random()-0.5).slice(0,3); let ci=0;
  const teams = [0,1,2,3].map(i=>({id:i, name:i===userSlot?name:cpu[ci++], isUser:i===userSlot, roster:[], pts:0}));
  const rounds = Math.max(3, Math.min(6, Math.floor(poolPlayers.length/4)));
  const order=[]; for(let rd=0; rd<rounds; rd++){ order.push(...(rd%2===0?[0,1,2,3]:[3,2,1,0])); }
  game = { phase:'draft', startedAt:today(), teams, userSlot, order, rounds, pickIdx:0, draftLog:[],
    players:poolPlayers, pool:poolPlayers.map(p=>p.id),
    demons:src.demons, knownDemons:src.demons.map(d=>d.name.toLowerCase()), watch:src.watch,
    dataSource:src.source, dataUpdated:src.updated,
    lastRecordId:null, armed:false, scoredKeys:[], events:[], lastSync:null, faUsedOn:null };
  tab='league'; runCpuPicks(); persistGame(); render();
}
function cpuChoose(){ let best=game.pool[0], bv=-1;
  game.pool.forEach(id=>{ const v=draftValue(gp(id))+Math.random()*9; if(v>bv){bv=v;best=id;} }); return best; }
function runCpuPicks(){
  if(game.mode==='multi') return;
  while(game.pickIdx<game.order.length && game.order[game.pickIdx]!==game.userSlot){
    const tId=game.order[game.pickIdx]; const pid=cpuChoose();
    game.teams[tId].roster.push(pid); game.pool=game.pool.filter(x=>x!==pid);
    game.draftLog.unshift({team:game.teams[tId].name, player:gp(pid).name, n:game.pickIdx+1});
    game.pickIdx++;
  }
  if(game.pickIdx>=game.order.length){ game.phase='live'; }
}
function userPick(pid){
  if(!game || game.phase!=='draft' || game.order[game.pickIdx]!==mySlot() || !game.pool.includes(pid)) return;
  if(game.mode==='multi'){ mpUserPick(pid); return; }
  game.teams[game.userSlot].roster.push(pid); game.pool=game.pool.filter(x=>x!==pid);
  game.draftLog.unshift({team:game.teams[game.userSlot].name, player:gp(pid).name, n:game.pickIdx+1, you:true});
  game.pickIdx++; runCpuPicks(); persistGame(); render();
}
function doSwap(addId){
  if(dropSel==null || faUsedToday() || !game.pool.includes(addId)) return;
  const ms = mySlot(); if(ms<0) return;
  const me = game.teams[ms];
  if(!me.roster.includes(dropSel)) return;
  me.roster = me.roster.filter(x=>x!==dropSel).concat(addId);
  game.pool = game.pool.filter(x=>x!==addId).concat(dropSel);
  markFaUsed();
  addEvent({source:'note', player:'', team:me.name, pts:0, txt:me.name+' signs '+gp(addId).name+' and releases '+gp(dropSel).name, video:null});
  dropSel=null;
  if(game.mode==='multi'){ mpPushLive(); } else { persistGame(); }
  render();
}

// ---------- event bookkeeping ----------
function addEvent(ev){ // {source, player, txt, pts, video}
  ev.when = nowStr();
  game.events.unshift(ev);
  if(game.events.length>250) game.events.length = 250;
  if(syncDelta) syncDelta.newEvents.push(ev);
}
function award(pid, pts, ev){
  const p = gp(pid); const t = teamOf(pid);
  if(pts>0){ p.pts += pts; if(t) t.pts += pts;
    if(syncDelta && t) syncDelta.teamPtsDelta[t.id] = (syncDelta.teamPtsDelta[t.id]||0) + pts; }
  ev.pts = pts; ev.player = p.name; ev.team = t ? t.name : '';
  addEvent(ev);
}
function seenKey(k){ k=k.toLowerCase(); if(game.scoredKeys.includes(k)) return true;
  game.scoredKeys.push(k); if(game.scoredKeys.length>500) game.scoredKeys.shift();
  if(syncDelta) syncDelta.newKeys.push(k);
  return false; }

// ---------- pointercrate record tracking ----------
async function findMaxRecordId(){
  // try the Link header (rel=last) first
  const first = await tryFetchRaw(PC+'/v1/records/?limit=1');
  if(first.json===null && first.status===0) return null; // unreachable
  if(first.link){
    const m = /<([^>]+)>;\s*rel="?last"?/.exec(first.link);
    if(m){ const last = await tryFetchJSON(m[1].startsWith('http')?m[1]:('https://pointercrate.com'+m[1]));
      if(Array.isArray(last)&&last.length) return last[last.length-1].id; }
  }
  // exponential + binary probe on "does a record with id > x exist"
  const existsAfter = async (x)=>{ const j = await tryFetchJSON(PC+'/v1/records/?limit=1&after='+x);
    return Array.isArray(j) ? j.length>0 : null; };
  let lo=0, hi=200000;
  let e = await existsAfter(hi);
  if(e===null) return null;
  let guard=0;
  while(e===true && guard++<12){ lo=hi; hi*=2; e=await existsAfter(hi); if(e===null) return null; }
  // now no records after hi; some after lo (or lo=0)
  guard=0;
  while(hi-lo>1 && guard++<26){
    const mid = Math.floor((lo+hi)/2);
    const em = await existsAfter(mid);
    if(em===null) return null;
    if(em) lo=mid; else hi=mid;
  }
  const j = await tryFetchJSON(PC+'/v1/records/?limit=1&after='+lo);
  return (Array.isArray(j)&&j.length) ? j[0].id : lo;
}

async function pullNewRecords(){
  const out=[]; let guard=0;
  while(guard++<5){
    const r = await tryFetchRaw(PC+'/v1/records/?limit=100&after='+game.lastRecordId);
    if(r.json===null && r.status===0 && out.length===0) return null; // network failure
    const res = r.json;
    if(!Array.isArray(res) || res.length===0) break;
    out.push(...res);
    game.lastRecordId = res[res.length-1].id;
    if(res.length<100) break;
  }
  return out;
}

function scoreRecordObj(rec){
  const pname = rec.player && rec.player.name;
  const pid = pidByName(pname);
  if(!pid) return;
  const demon = (rec.demon && rec.demon.name) || 'a listed demon';
  const pos = rec.demon ? rec.demon.position : null;
  const prog = (typeof rec.progress==='number') ? rec.progress : 100;
  const key = 'rec|'+pname+'|'+demon+'|'+prog;
  if(seenKey(key)) return;
  const pts = scoreRecord(pos, prog);
  if(pts<=0) return;
  award(pid, pts, { source:'record',
    txt: (prog>=100 ? ((pos&&pos<=10?'\u2605 TOP-10 CLEAR \u2014 ':'CLEAR \u2014 ')+demon+(pos?(' (#'+pos+')'):'')) : ('new best '+prog+'% on '+demon+(pos?(' (#'+pos+')'):''))),
    video: rec.video || null });
}

function diffNewDemons(freshDemons){
  if(!Array.isArray(freshDemons)||!freshDemons.length) return;
  freshDemons.forEach(d=>{
    const key = String(d.name||'').toLowerCase();
    if(!key || game.knownDemons.includes(key)) return;
    game.knownDemons.push(key);
    const pid = pidByName(d.verifier);
    if(pid && !seenKey('fv|'+d.verifier+'|'+d.name)){

// ---------- GDBrowser profile tracking (GD Colon's API) ----------
// GDBrowser's server sends no CORS headers, so browsers can't call it
// directly from another site. We route through public CORS relays instead
// (corsproxy.io's free tier allows github.io origins). Only public GD
// usernames ever pass through the relay.
const GD_PROXIES = [
  (u)=>u, // try direct first, in case CORS is ever enabled
  (u)=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  (u)=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  (u)=>'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u),
];
let gdRoute = null; // remembers which relay worked this session
async function fetchGD(path){
  const target = GDB + path;
  const idxs = GD_PROXIES.map((_,i)=>i);
  const order = gdRoute!=null ? [gdRoute, ...idxs.filter(i=>i!==gdRoute)] : idxs;
  for(const i of order){
    const r = await tryFetchRaw(GD_PROXIES[i](target), 12000);
    if(r.json!==null){ gdRoute=i; return r; }
  }
  return {json:null, link:null, status:0};
}

async function syncGDProfiles(){
  const pids = rosteredPids();
  // quick reachability check with the first player
  for(let i=0;i<pids.length;i++){
    const p = gp(pids[i]);
    syncMsg = 'checking GD profiles '+(i+1)+'/'+pids.length+' ('+p.name+')\u2026'; renderSyncBar();
    const uname = p.gdName || p.name;
    const rr = await fetchGD('/profile/'+encodeURIComponent(uname));
    if(i===0 && rr.json===null && rr.status===0){ // unreachable even via relays -> skip pass
      addEvent({source:'note', player:'', team:'', pts:0, txt:'GDBrowser couldn\u2019t be reached (even through a relay) \u2014 profile points will catch up next check', video:null});
      return false;
    }
    const j = rr.json;
    if(!j || typeof j.demons!=='number'){ p.gdStatus='miss'; await sleep(1200); continue; }
    p.gdStatus='ok';
    if(p.gdDemons==null){
      p.gdDemons = j.demons;
      addEvent({source:'gd', player:p.name, team:(teamOf(pids[i])||{}).name||'', pts:0, txt:'GD profile linked \u2014 '+j.demons+' demons (baseline set)', video:null});
    } else if(j.demons > p.gdDemons){
      const d = j.demons - p.gdDemons;
      award(pids[i], d*GD_DEMON_PTS, { source:'gd', txt:'+'+d+' new demon'+(d>1?'s':'')+' beaten on their GD profile ('+p.gdDemons+' \u2192 '+j.demons+')', video:null });
      p.gdDemons = j.demons;
    } else { p.gdDemons = j.demons; }
    await sleep(1200); // be considerate to GDBrowser + the relay (rate limits)
  }
  return true;
}

      let demons = await tryFetchJSON(PC+'/v2/demons/listed?limit=100');
      if(demons && demons.data) demons = demons.data;
      if(Array.isArray(demons)) diffNewDemons(demons.map(d=>({position:d.position,name:d.name,verifier:(d.verifier&&d.verifier.name)||''})));
      // 3) refresh the board
      const fresh = await loadFromAPI();
      if(fresh){ DATA=fresh; await store.set(KEY_DATA, JSON.stringify(fresh)); }
      // 4) GD profiles via GDBrowser (through the relay)
      await syncGDProfiles();
    } else {
      // pointercrate unreachable this time — nothing is scored, nothing invented
      addEvent({source:'note', player:'', team:'', pts:0, txt:'pointercrate couldn\u2019t be reached \u2014 nothing scored this check, try again in a bit', video:null});

}

// ==================== FRIENDS LEAGUE (Supabase) ====================
// One shared JSON doc per league in a `leagues` table:
//   id text primary key, rev bigint, data jsonb
// Every write is conditional on `rev` (optimistic concurrency), so two
// friends can never silently overwrite each other. Accounts are a
// username + 4-digit PIN per league (lightly hashed — it's a game, so
// don't reuse a real password).
const pinHash = (name,pin)=> hashStr(String(name).toLowerCase()+'|'+String(pin)).toString(36);
const leagueCode = ()=>{ const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let c='DM';
  for(let i=0;i<4;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; };

function sbHeaders(){ return {apikey:MP.key, 'Authorization':'Bearer '+MP.key, 'Prefer':'return=representation'}; }
async function sbCall(method, path, body){
  if(!MP || !MP.url || !MP.key) return {json:null,status:0};
  const base = MP.url.replace(/\/+$/,'');
  return await tryFetchRaw(base+path, 10000, {method, headers:sbHeaders(), body});
}
async function mpFetchLeague(id){
  const r = await sbCall('GET','/rest/v1/leagues?id=eq.'+encodeURIComponent(id)+'&select=*');
  if(Array.isArray(r.json) && r.json.length) return r.json[0];
  return (r.status===200 || r.status===206) ? false : null; // false = not found, null = network/config problem
}
async function mpPush(doc){
  doc.updatedAt = nowStr();
  const r = await sbCall('PATCH','/rest/v1/leagues?id=eq.'+encodeURIComponent(mpSession.leagueId)+'&rev=eq.'+mpRev,
    {data:doc, rev:mpRev+1});
  if(Array.isArray(r.json) && r.json.length===1){ mpRev++; return true; }
  return false;
}
async function mpRefresh(silent){
  if(!mpSession) return false;
  const row = await mpFetchLeague(mpSession.leagueId);
  if(!row){ if(!silent){ mpStatus = row===false ? 'league not found \u2014 was it deleted?' : 'can\u2019t reach the league server'; } return false; }
  const changed = row.rev !== mpRev || !game;
  mpRev = row.rev; game = row.data; game.mode='multi';
  return changed;
}
async function mpMutate(fn, tries){
  // fetch-fresh -> mutate -> conditional push, retried on conflicts
  for(let i=0;i<(tries||4);i++){
    const ok0 = await mpRefresh(true); if(game==null) return false;
    const doc = deepClone(game); doc.mode='multi';
    const res = fn(doc);
    if(res===false) return false; // mutation no longer valid
    if(await mpPush(doc)){ game = doc; return true; }
  }
  mpStatus='the league was busy \u2014 try again'; return false;
}

async function mpStartDraft(){
  mpLoading=true; mpStatus='building the draft\u2026'; render();
  const ok = await mpMutate((doc)=>{
    if(doc.phase!=='lobby') return false;
    if(!mpSession || doc.members[0].id!==mpSession.memberId){ mpStatus='only the league creator can start the draft'; return false; }
    const humans = doc.members.map(m=>({name:m.team, ownerId:m.id}));
    const cpus = [...CPU_NAMES].sort(()=>Math.random()-0.5).slice(0, Math.max(0,4-humans.length)).map(n=>({name:n, ownerId:null}));
    const slots = [...humans, ...cpus].sort(()=>Math.random()-0.5);
    doc.teams = slots.map((t,i)=>({id:i, name:t.name, ownerId:t.ownerId, roster:[], pts:0}));
    doc.rounds = Math.max(3, Math.min(6, Math.floor(doc.players.length/4)));
    doc.order = []; for(let rd=0; rd<doc.rounds; rd++){ doc.order.push(...(rd%2===0?[0,1,2,3]:[3,2,1,0])); }
    doc.pickIdx = 0; doc.draftLog = []; doc.phase = 'draft'; doc.startedAt = today();
    doc.events.unshift({source:'note',player:'',team:'',pts:0,txt:'The draft has begun!',video:null,when:nowStr()});
    return true;
  });
  mpLoading=false;
  if(ok){ mpStatus=''; render(); mpCpuAdvance(); } else render();
}
function applyCpuPickTo(doc){
  const slot = doc.order[doc.pickIdx]; const t = doc.teams[slot];
  let best=doc.pool[0], bv=-1;
  const dv=(pid)=>{ const p=doc.players.find(x=>x.id===pid); return Math.round(clamp(99-(p.rank-1)*0.36,62,99)); };
  doc.pool.forEach(id=>{ const v=dv(id)+Math.random()*9; if(v>bv){bv=v;best=id;} });
  t.roster.push(best); doc.pool = doc.pool.filter(x=>x!==best);
  const pl = doc.players.find(x=>x.id===best);
  doc.draftLog.unshift({team:t.name, player:pl.name, n:doc.pickIdx+1});
  doc.pickIdx++;
  if(doc.pickIdx>=doc.order.length){ doc.phase='live';
    doc.events.unshift({source:'note',player:'',team:'',pts:0,txt:'Draft complete \u2014 hit \u21BB CHECK RECORDS to arm real tracking',video:null,when:nowStr()}); }
}
async function mpCpuAdvance(){
  let guard=0;
  while(guard++<30){
    if(!game || game.mode!=='multi' || game.phase!=='draft') return;
    const slot = game.order[game.pickIdx];
    if(game.teams[slot] && game.teams[slot].ownerId) return; // human turn
    const done = await mpMutate((doc)=>{
      if(doc.phase!=='draft') return false;
      const s2 = doc.order[doc.pickIdx];
      if(doc.teams[s2] && doc.teams[s2].ownerId) return false; // someone else advanced it
      applyCpuPickTo(doc);
      return true;
    }, 2);
    render();
    if(!done) return;
  }
}
async function mpUserPick(pid){
  mpLoading=true; render();
  await mpMutate((doc)=>{
    if(doc.phase!=='draft') return false;
    const slot = doc.order[doc.pickIdx];
    if(!doc.teams[slot] || doc.teams[slot].ownerId!==mpSession.memberId) return false;
    if(!doc.pool.includes(pid)) return false;
    doc.teams[slot].roster.push(pid); doc.pool = doc.pool.filter(x=>x!==pid);
    const pl = doc.players.find(x=>x.id===pid);
    doc.draftLog.unshift({team:doc.teams[slot].name, player:pl.name, n:doc.pickIdx+1, you:true});
    doc.pickIdx++;
    if(doc.pickIdx>=doc.order.length){ doc.phase='live';
      doc.events.unshift({source:'note',player:'',team:'',pts:0,txt:'Draft complete \u2014 hit \u21BB CHECK RECORDS to arm real tracking',video:null,when:nowStr()}); }
    return true;
  });
  mpLoading=false; render(); mpCpuAdvance();
}

function myPendingTrades(){ const ms=mySlot();

async function mpSendTrade(){
  if(!tradeDraft || tradeDraft.toSlot==null || !tradeDraft.give.length || !tradeDraft.get.length) return;
  const td = tradeDraft;
  mpLoading=true; render();

    const give = td.give.filter(p=>doc.teams[ms].roster.includes(p));

    doc.trades = doc.trades||[];
    doc.trades.unshift({id:'t'+Math.random().toString(36).slice(2,8), fromSlot:ms, toSlot:td.toSlot,
      give, get, by:mpSession.username, at:nowStr(), status:'pending'});
    if(doc.trades.length>40) doc.trades.length=40;
    return true;
  });
  mpLoading=false;
  if(ok){ tradeDraft=null; mpStatus=''; }

async function mpRespondTrade(id, accept){
  mpLoading=true; render();
  await mpMutate((doc)=>{
    const tr = (doc.trades||[]).find(t=>t.id===id);
    if(!tr || tr.status!=='pending') return false;
    const ms = doc.teams.findIndex(t=>t.ownerId===mpSession.memberId);
    if(tr.toSlot!==ms) return false;
    if(!accept){ tr.status='declined'; return true; }
    const A = doc.teams[tr.fromSlot], B = doc.teams[tr.toSlot];
    if(!tr.give.every(p=>A.roster.includes(p)) || !tr.get.every(p=>B.roster.includes(p))){ tr.status='void'; return true; }
    A.roster = A.roster.filter(p=>!tr.give.includes(p)).concat(tr.get);
    B.roster = B.roster.filter(p=>!tr.get.includes(p)).concat(tr.give);
    tr.status='accepted';
    const nm=(pid)=>{ const p=doc.players.find(x=>x.id===pid); return p?p.name:'?'; };
    doc.events.unshift({source:'trade',player:'',team:'',pts:0,
      txt:'TRADE: '+A.name+' sends '+tr.give.map(nm).join(', ')+' to '+B.name+' for '+tr.get.map(nm).join(', '),video:null,when:nowStr()});
    return true;
  });
  mpLoading=false; render();
}
async function mpCancelTrade(id){
  mpLoading=true; render();
  await mpMutate((doc)=>{
    const tr=(doc.trades||[]).find(t=>t.id===id);
    const ms = doc.teams.findIndex(t=>t.ownerId===mpSession.memberId);

}

// ---- sync lock + conflict-safe finish ----
async function mpAcquireLock(){
  for(let i=0;i<3;i++){
    await mpRefresh(true); if(!game) return false;
    const L = game.syncLock;
    if(L && L.by!==mpSession.memberId && (Date.now()-(L.at||0))<180000){
      mpStatus=(L.name||'someone')+' is already checking records \u2014 refresh in a moment'; return false; }
    const doc = deepClone(game);
    doc.syncLock = {by:mpSession.memberId, name:mpSession.username, at:Date.now()};
    if(await mpPush(doc)){ game=doc; return true; }
  }
  return false;
}
async function mpFinishSync(delta){
  const localG = game;
  for(let i=0;i<4;i++){
    const doc = deepClone(game); doc.syncLock=null;
    if(await mpPush(doc)){ game=doc; return true; }
    const row = await mpFetchLeague(mpSession.leagueId);
    if(!row) return false;
    mpRev = row.rev;
    const base = row.data; base.mode='multi';
    base.players = localG.players; base.demons = localG.demons; base.knownDemons = localG.knownDemons;
    base.lastRecordId = localG.lastRecordId; base.armed = localG.armed; base.lastSync = localG.lastSync;
    base.scoredKeys = Array.from(new Set([...(base.scoredKeys||[]), ...delta.newKeys])).slice(-500);
    base.events = [...delta.newEvents, ...(base.events||[])].slice(0,250);
    Object.keys(delta.teamPtsDelta).forEach(k=>{ if(base.teams[k]) base.teams[k].pts += delta.teamPtsDelta[k]; });
    base.syncLock = null;
    game = base;
  }
  return false;
}

        + demonFace(['#b44dff','#ff4dd2','#ff5a5a','#ffa04d'][t.id],26)
        + '<div style="flex:1;min-width:0"><div style="font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.name)+(isMine(t)?' <span style="color:var(--gold);font-size:11px">YOU</span>':(ownerName(t)?' <span style="color:var(--easy);font-size:11px">@'+esc(ownerName(t))+'</span>':''))+'</div>'
        + '<div style="font-size:12px;color:var(--dim)">'+t.roster.map(pid=>esc(gp(pid).name)).join(', ')+'</div></div>'
        + '<div class="display" style="color:'+(i===0?'var(--gold)':'var(--text)')+';font-size:20px">'+t.pts+'</div></div>').join('')
     + '</div>';
    if(game.watch && game.watch.length){
      html += '<div class="panel" style="margin-top:12px"><div style="font-size:12px;letter-spacing:1px;color:var(--dim);margin-bottom:8px">VERIFICATION WATCH \u00B7 real upcoming levels</div>'
       + game.watch.map(w=>'<div class="row"><div style="flex:1;min-width:0"><div style="font-weight:800">'+esc(w.level)+'</div>'
          + '<div style="font-size:12px;color:var(--dim)">'+(w.player&&w.player!=='community'?esc(w.player)+' \u00B7 ':'')+esc(w.note||'')+'</div></div>'
          + '<a class="smbtn" target="_blank" rel="noopener" href="'+linkYT(w.level)+'">watch \u2197</a></div>').join('')
       + '</div>';
    }
  }

  if(tab==='scores'){
    html += '<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">'
     + '<div class="display" style="font-size:20px">THE FEED</div>'
     + '<button class="smbtn" data-a="sync" '+(syncing?'disabled':'')+'>'+(syncing?'checking\u2026':'\u21BB check records')+'</button></div>'
     + '<div id="syncbar" class="mono" style="font-size:12px;color:var(--dim);margin-top:6px">'+(syncing?('<span class="spinner"></span>&nbsp; '+esc(syncMsg)):'')+'</div></div>'
     + '<div style="display:grid;gap:8px;margin-top:12px">'
     + (game.events.length ? game.events.map(eventHTML).join('') :
        '<div class="panel" style="color:var(--dim);font-size:14px">Nothing yet. Hit <b style="color:var(--gold)">\u21BB check records</b> \u2014 the first check arms tracking (baseline), and from then on every approved record, first victor, and new GD-profile demon by a rostered player shows up here with real points and a \u25B6 link to the actual run when pointercrate has the video.</div>')
     + '</div>';
  }

  if(tab==='trades' && game.mode==='multi'){
    const ms = mySlot();
    const partners = game.teams.filter(t=>t.ownerId && t.id!==ms);
    const nm = (pid)=>{ const p=gp(pid); return p?p.name:'?'; };
    const mine = myPendingTrades();
    const toMe = mine.filter(t=>t.toSlot===ms);
    const fromMe = mine.filter(t=>t.fromSlot===ms);
    html += '<div class="panel"><div class="display" style="font-size:20px">TRADE CENTER</div>'
     + '<div style="color:var(--dim);font-size:13px;margin-top:4px">Any players, any counts \u2014 the other manager has to accept. Points already scored stay with the team; the player earns for their new squad from then on.</div>'
     + (mpStatus?'<div class="chip" style="margin-top:8px;color:var(--med)">'+esc(mpStatus)+'</div>':'')
     + '</div>';
    if(toMe.length){
      html += '<div class="panel" style="margin-top:12px;border-color:var(--gold)"><div style="font-size:12px;letter-spacing:1px;color:var(--gold);margin-bottom:8px">OFFERS FOR YOU</div>'
       + toMe.map(t=>'<div class="feeditem" style="border-left:3px solid var(--gold);margin-bottom:8px">'
          + '<div style="font-size:13.5px"><b>'+esc(game.teams[t.fromSlot].name)+'</b> offers <b style="color:var(--gold)">'+t.give.map(nm).map(esc).join(', ')+'</b>'
          + ' for your <b style="color:var(--insane)">'+t.get.map(nm).map(esc).join(', ')+'</b></div>'
          + '<div style="display:flex;gap:8px;margin-top:8px">'
          + '<button class="smbtn" data-a="tradeAccept" data-id="'+esc(t.id)+'" style="border-color:var(--live);color:var(--live)" '+(mpLoading?'disabled':'')+'>\u2713 accept</button>'
          + '<button class="smbtn" data-a="tradeDecline" data-id="'+esc(t.id)+'" style="border-color:var(--hard);color:var(--hard)" '+(mpLoading?'disabled':'')+'>\u2715 decline</button>'
          + '</div></div>').join('')
       + '</div>';
    }
    if(fromMe.length){
      html += '<div class="panel" style="margin-top:12px"><div style="font-size:12px;letter-spacing:1px;color:var(--dim);margin-bottom:8px">YOUR PENDING OFFERS</div>'
       + fromMe.map(t=>'<div class="feeditem" style="margin-bottom:8px"><div style="font-size:13px">to <b>'+esc(game.teams[t.toSlot].name)+'</b>: '
          + esc(t.give.map(nm).join(', '))+' \u21C4 '+esc(t.get.map(nm).join(', '))+'</div>'
          + '<button class="smbtn" data-a="tradeCancel" data-id="'+esc(t.id)+'" style="margin-top:6px" '+(mpLoading?'disabled':'')+'>cancel</button></div>').join('')
       + '</div>';
    }
    if(!tradeDraft){
      html += '<div class="panel" style="margin-top:12px"><div style="font-size:12px;letter-spacing:1px;color:var(--dim);margin-bottom:8px">PROPOSE A TRADE</div>'
       + (partners.length
          ? '<div style="display:flex;gap:8px;flex-wrap:wrap">'+partners.map(t=>'<button class="smbtn" data-a="tradeTo" data-id="'+t.id+'">with '+esc(t.name)+' (@'+esc(ownerName(t)||'')+')</button>').join('')+'</div>'
          : '<div style="color:var(--dim);font-size:13px">No friend-managed teams yet \u2014 CPU squads don\u2019t answer the phone.</div>')
       + '</div>';
    } else {
      const other = game.teams[tradeDraft.toSlot];
      const chip = (pid, sel, act)=>'<button class="smbtn" data-a="'+act+'" data-id="'+esc(pid)+'" style="'+(sel?'border-color:var(--gold);color:var(--gold);background:rgba(255,210,77,.12)':'')+'">'+esc(nm(pid))+' <span class="mono" style="font-size:10px;color:var(--dim)">#'+gp(pid).rank+'</span></button>';
      html += '<div class="panel" style="margin-top:12px"><div style="font-size:12px;letter-spacing:1px;color:var(--gold);margin-bottom:8px">TRADING WITH '+esc(other.name).toUpperCase()+'</div>'
       + '<div style="font-size:12.5px;color:var(--dim);margin-bottom:6px">YOU SEND \u2014 tap to select:</div>'
       + '<div style="display:flex;gap:6px;flex-wrap:wrap">'+ (game.teams[ms]?game.teams[ms].roster:[]).map(pid=>chip(pid, tradeDraft.give.includes(pid), 'tradeGive')).join('') +'</div>'
       + '<div style="font-size:12.5px;color:var(--dim);margin:12px 0 6px">YOU GET \u2014 tap to select:</div>'
       + '<div style="display:flex;gap:6px;flex-wrap:wrap">'+ other.roster.map(pid=>chip(pid, tradeDraft.get.includes(pid), 'tradeGet')).join('') +'</div>'
       + '<div style="display:flex;gap:8px;margin-top:14px">'
       + '<button class="bigbtn" data-a="tradeSend" style="width:auto;padding:12px 22px" '+((tradeDraft.give.length&&tradeDraft.get.length&&!mpLoading)?'':'disabled')+'>SEND OFFER</button>'
       + '<button class="smbtn" data-a="tradeClear">discard</button></div></div>';
    }
    const hist = (game.trades||[]).filter(t=>t.status!=='pending').slice(0,6);
    if(hist.length){
      html += '<div class="panel" style="margin-top:12px"><div style="font-size:12px;letter-spacing:1px;color:var(--dim);margin-bottom:8px">RECENT</div>'
       + hist.map(t=>'<div style="font-size:12.5px;color:var(--dim);padding:5px 0">'+esc(game.teams[t.fromSlot].name)+' \u21C4 '+esc(game.teams[t.toSlot].name)
          + ' \u00B7 '+esc(t.give.map(nm).join(', '))+' for '+esc(t.get.map(nm).join(', '))
          + ' \u00B7 <b style="color:'+(t.status==='accepted'?'var(--live)':'var(--hard)')+'">'+t.status+'</b></div>').join('')
       + '</div>';
    }
  }

  if(tab==='team'){
    html += '<div class="panel"><div class="display" style="font-size:20px">'+esc(me.name)+' \u00B7 <span style="color:var(--gold)">'+me.pts+' pts</span></div>'
     + '<div style="color:var(--dim);font-size:13px;margin-top:4px">'+(faUsedToday()?'Free-agent swap used today.':(dropSel?('Dropping <b style="color:var(--hard)">'+esc(gp(dropSel).name)+'</b> \u2014 pick a free agent below.'):'One swap per day: tap <b>drop</b>, then sign a free agent.'))+'</div>'
     + '<div style="color:var(--dim);font-size:12px;margin-top:4px">If a GD profile shows \u201Cnot found\u201D, their in-game name differs \u2014 tap <b>gd name</b> and fix it.</div></div>'
     + '<div class="grid" style="margin-top:12px">'
     + me.roster.slice().sort((a,b)=>gp(b).pts-gp(a).pts||gp(a).rank-gp(b).rank).map(pid=>{
        const p=gp(pid);
        return '<div>'+playerCardHTML(p,{})
         + '<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">'
         + '<a class="smbtn" target="_blank" rel="noopener" href="'+linkYTLive(p.name)+'">\uD83D\uDD34</a>'
         + '<a class="smbtn" target="_blank" rel="noopener" href="'+linkTwitch(p.name)+'">TW</a>'
         + '<a class="smbtn" target="_blank" rel="noopener" href="'+linkGDB(p.gdName||p.name)+'">GD \u2197</a>'
         + '<button class="smbtn" data-a="editGd" data-id="'+esc(pid)+'">gd name</button>'
         + '<button class="smbtn" data-a="dropSel" data-id="'+esc(pid)+'" style="'+(dropSel===pid?'border-color:var(--hard);color:var(--hard)':'')+'">drop</button>'
         + '</div>'
         + (editGd===pid?('<div style="display:flex;gap:6px;margin-top:6px"><input class="mini" id="gdin_'+esc(pid)+'" type="text" value="'+esc(p.gdName||p.name)+'"/><button class="smbtn" data-a="saveGd" data-id="'+esc(pid)+'">save</button></div>'):'')
         + '</div>';
       }).join('')
     + '</div>';
    if(dropSel && !faUsedToday()){
      html += '<div class="panel" style="margin-top:14px"><div style="font-size:12px;letter-spacing:1px;color:var(--dim);margin-bottom:8px">FREE AGENTS \u2014 tap to sign</div>'
       + '<div class="grid">'+game.pool.slice().sort((a,b)=>gp(a).rank-gp(b).rank).map(pid=>playerCardHTML(gp(pid),{clickable:true,action:'sign'})).join('')+'</div></div>';
    }
  }

  if(tab==='board'){
    html += '<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px">'
     + '<div class="display" style="font-size:20px">THE LIST \u00B7 TOP '+DATA.players.length+'</div>'+srcPill(DATA.source, DATA.updated)+'</div>'
     + '<div style="color:var(--dim);font-size:12.5px;margin-bottom:8px">Tap a player for streams, their GD profile, and a live scout report.</div>'
     + DATA.players.slice(0,boardShown).map(boardRowHTML).join('')
     + (boardShown<DATA.players.length?('<button class="smbtn" data-a="more" style="margin-top:10px">show more ('+(DATA.players.length-boardShown)+' left)</button>'):'')
     + '</div>';
  }

  if(tab==='rules'){
    html += '<div class="panel"><div class="display" style="font-size:20px;margin-bottom:8px">REAL SCORING</div>'
     + '<div style="color:var(--dim);font-size:13px;margin-bottom:8px">Like fantasy football: the events are real, the point values are this league\u2019s. No simulation anywhere.</div>'
     + [['Approved record \u00B7 top-10 demon \u00B7 100%','60','var(--gold)'],['Approved record \u00B7 main list (#11\u201375) \u00B7 100%','25','var(--extreme)'],['Approved record \u00B7 extended list (#76\u2013150) \u00B7 100%','12','var(--hard)'],['Approved progress record \u00B7 main list','1 pt / 6%','var(--easy)'],['FIRST VICTOR \u2014 new level enters the List, verified by your player','140','var(--gold)'],['Each new demon beaten on their GD profile (via GDBrowser)','4','var(--insane)']]
        .map(([l,v,c],i)=>'<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 4px;'+(i?'border-top:1px solid var(--line);':'')+'font-size:13.5px"><span>'+l+'</span><span class="mono" style="color:'+c+';font-weight:700;white-space:nowrap">'+v+'</span></div>').join('')
     + '</div>'
     + '<div class="panel" style="margin-top:12px"><div class="display" style="font-size:20px;margin-bottom:8px">HOW TRACKING WORKS</div>'
     + '<div style="color:var(--dim);font-size:14px;line-height:1.6">'
     + 'Your first <b style="color:var(--gold)">\u21BB check</b> sets the baseline: the newest pointercrate record ID and every rostered player\u2019s current GD demon count. '
     + 'After that, each check pulls every record approved since, diffs the List for brand-new levels (real first victors!), and re-reads GD profiles via GDBrowser \u2014 GD Colon\u2019s API. '
     + 'A record card links straight to the actual completion video when pointercrate has it.<br><br>'
     + '<b style="color:var(--text)">The relay:</b> GDBrowser doesn\u2019t allow direct calls from other websites (no CORS headers), so profile checks go through a public relay like corsproxy.io \u2014 only public GD usernames are ever sent, and the checks are paced politely, which is why a full check takes about half a minute. '
     + 'If every relay is down, that check just skips profiles and catches up next time.<br><br>'
     + '<b style="color:var(--text)">Fair play:</b> points only ever come from events with a real source \u2014 nothing is invented, and if a feed can\u2019t be reached, nothing is scored. '
     + 'CPU squads score from the exact same feeds. One free-agent swap per day. '
     + 'GD profile counts include every rated demon (so a stream night of easy demons still pays 4 apiece), and list records stack on top.</div></div>'
     + (game.mode==='multi' ? ('<div class="panel" style="margin-top:12px"><div class="display" style="font-size:20px;margin-bottom:8px">FRIENDS LEAGUE</div>'
     + '<div style="color:var(--dim);font-size:14px;line-height:1.6">'
     + 'The league lives in a shared database (Supabase) \u2014 everyone sees the same standings, draft, and feed, and screens auto-refresh every \u007E25 seconds. '
     + 'Accounts are a username + PIN <b style="color:var(--text)">per league</b>: the PIN is lightly scrambled, not bank-grade security, so never reuse a real password. '
     + 'Anyone in the league can hit \u21BB check \u2014 a league lock stops two checks from double-counting. '
     + 'Trades swap players between friend squads once the other manager accepts; already-scored points stay put, and the player earns for their new team going forward. '
     + 'Logging out only affects your device \u2014 the league keeps living on the server for everyone else.</div></div>') : '');
  }

  html += '<div style="height:90px"></div></div>';
  app.innerHTML = html;
  if(confirmReset) app.innerHTML += resetHTML();
}

function headerHTML(){
  const badge = (game&&game.phase==='live'&&game.startedAt)?'<span class="chip mono">DAY '+Math.max(1,Math.round((Date.now()-new Date(game.startedAt+'T00:00:00').getTime())/86400000)+1)+'</span>':'';
  const code = (mode==='multi'&&game&&game.code)?'<span class="chip mono" style="color:var(--gold)">'+esc(game.code)+'</span>':'';
  const toggles = '<span style="display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden">'
   + '<button class="smbtn" data-a="modeSolo" style="border:none;border-radius:0;'+(mode==='solo'?'background:rgba(255,210,77,.18);color:var(--gold)':'')+'">solo</button>'
   + '<button class="smbtn" data-a="modeMulti" style="border:none;border-radius:0;'+(mode==='multi'?'background:rgba(255,210,77,.18);color:var(--gold)':'')+'">friends</button></span>';
  const extras = mode==='multi'
   ? '<button class="smbtn" data-a="mpRefreshBtn" title="Refresh league">\u21BB</button><button class="smbtn" data-a="reset">'+(mpSession?'log out':'back')+'</button>'
   : '<button class="smbtn" data-a="resync" title="Re-sync board data">\u21BB board</button><button class="smbtn" data-a="reset">reset</button>';
  return '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 2px;flex-wrap:wrap;gap:8px" class="wrap">'
   + '<div style="display:flex;align-items:center;gap:10px">'+demonFace('#b44dff',30)
   + '<div class="display" style="font-size:20px">DEMON <span style="color:var(--gold)">MYTHS</span></div></div>'
   + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+toggles+code+badge+extras+'</div></div>';
}
function tickerHTML(){
  const bits=[];
  if(game){
    game.events.slice(0,6).forEach(e=>{ if(e.pts>0) bits.push(e.player+': '+e.txt+' (+'+e.pts+')'); });
    (game.watch||[]).forEach(w=> bits.push('WATCH: '+w.level+(w.player&&w.player!=='community'?(' \u2014 '+w.player):'')));
  }
  const t = bits.length?bits:MEMES;
  const i = Math.floor(Date.now()/16000);
  return '<div class="ticker-outer"><div class="ticker-inner mono">&nbsp;&nbsp;&nbsp;\u27E1 '+esc(t[i%t.length])+' &nbsp;&nbsp;&nbsp;\u27E1 '+esc(t[(i+1)%t.length])+'</div></div>';
}
function resetHTML(){
  return '<div class="modalbg"><div class="modal" style="max-width:340px;text-align:center">'
   + '<div style="font-size:30px">\uD83D\uDC80</div><div class="display" style="font-size:20px;margin:6px 0">'+(mode==='multi'?'Log out of this league?':'Delete this season?')+'</div>'
   + '<div style="color:var(--dim);font-size:13px;margin-bottom:16px">'+(mode==='multi'?'This only logs you out on this device \u2014 the shared league and everyone\u2019s points stay safe on the server.':'Your saved league (and all its real tracked points) is wiped. No respawns.')+'</div>'
   + '<button class="bigbtn" data-a="resetConfirm">'+(mode==='multi'?'LOG OUT':'YES, WIPE IT')+'</button>'
   + '<button class="smbtn" data-a="resetCancel" style="margin-top:10px;border:none;background:transparent;color:var(--dim)">keep my season</button></div></div>';
}

// ---------- events ----------
document.addEventListener('click',(e)=>{
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.getAttribute('data-a'); const id = el.getAttribute('data-id');
  if(a==='start') startDraft();
  else if(a==='pick') userPick(id);
  else if(a==='tab'){ tab=(tab===id && !game)?'':id; expandRow=null; render(); }
  else if(a==='sync') syncScores();
  else if(a==='dropSel'){ dropSel=(dropSel===id?null:id); render(); }
  else if(a==='sign') doSwap(id);
  else if(a==='editGd'){ editGd=(editGd===id?null:id); render(); }
  else if(a==='saveGd') setGdName(id);
  else if(a==='expand'){ expandRow=(expandRow===Number(id)?null:Number(id)); render(); }
  else if(a==='more'){ boardShown=Math.min(boardShown+25, DATA.players.length); render(); }
  else if(a==='reset'){ confirmReset=true; render(); }
  else if(a==='resetCancel'){ confirmReset=false; render(); }
  else if(a==='resetConfirm') resetAll();
  else if(a==='resync'){ (async()=>{ DATA=null; render(); await bootData(true); render(); })(); }
  else if(a==='modeSolo'){ if(mode!=='solo'){ mode='solo'; game=soloGameCache; tab='league'; mpStatus=''; render(); } }
  else if(a==='modeMulti'){ if(mode!=='multi'){ soloGameCache=game; mode='multi'; game=null; tab='league';
      if(mpSession){ mpLoading=true; render(); mpRefresh().then(()=>{ mpLoading=false; if(game&&game.phase==='draft') mpCpuAdvance(); render(); }); }
      else { mpScreen = MP?'home':'connect'; render(); } } }
  else if(a==='mpRefreshBtn'){ (async()=>{ mpLoading=true; render(); await mpRefresh(); mpLoading=false; if(game&&game.phase==='draft') mpCpuAdvance(); render(); })(); }
  else if(a==='mpGoto'){ mpScreen=id; mpStatus=''; mpLoginPickId=null; window.__mpLoginRow=null; render(); }
  else if(a==='mpSaveCfg') mpSaveCfg();
  else if(a==='mpCreate') mpCreateLeague();
  else if(a==='mpJoin') mpJoinLeague();
  else if(a==='mpLogin') mpLogin();
  else if(a==='mpLoginPick'){ mpLoginPickId=id; render(); }
  else if(a==='mpStartDraft') mpStartDraft();
  else if(a==='tradeTo'){ tradeDraft={toSlot:Number(id), give:[], get:[]}; render(); }
  else if(a==='tradeGive'){ if(tradeDraft){ const i2=tradeDraft.give.indexOf(id); if(i2>=0) tradeDraft.give.splice(i2,1); else tradeDraft.give.push(id); render(); } }
  else if(a==='tradeGet'){ if(tradeDraft){ const i2=tradeDraft.get.indexOf(id); if(i2>=0) tradeDraft.get.splice(i2,1); else tradeDraft.get.push(id); render(); } }
  else if(a==='tradeSend') mpSendTrade();
  else if(a==='tradeClear'){ tradeDraft=null; render(); }
  else if(a==='tradeAccept') mpRespondTrade(id, true);
  else if(a==='tradeDecline') mpRespondTrade(id, false);
  else if(a==='tradeCancel') mpCancelTrade(id);
});
document.addEventListener('keydown',(e)=>{
  if((e.key==='Enter'||e.key===' ') && e.target.closest && e.target.closest('.card.clickable')){ e.preventDefault(); e.target.closest('.card.clickable').click(); }
  if(e.key==='Enter' && e.target.id==='nameInput') startDraft();
  if(e.key==='Enter' && e.target.id && e.target.id.indexOf('gdin_')===0) setGdName(e.target.id.slice(5));
});
setInterval(()=>{ const outer=document.querySelector('.ticker-outer'); if(outer && game && !syncing){
  const tmp=document.createElement('div'); tmp.innerHTML=tickerHTML(); outer.replaceWith(tmp.firstChild); } }, 16000);

// ---------- boot ----------
(async function(){
  renderBoot();
  try{ const raw=await store.get(KEY_SAVE); if(raw){ const g=JSON.parse(raw); if(g&&g.phase) game=g; } }catch(e){}
  try{ const c=await store.get(KEY_MPCFG); if(c) MP=JSON.parse(c); }catch(e){}
  try{ const s2=await store.get(KEY_MPSES); if(s2) mpSession=JSON.parse(s2); }catch(e){}
  await bootData(false);
  if(MP && mpSession){
    bootLog.push('logging into your friends league\u2026'); renderBoot();
    soloGameCache = game; game = null; mode='multi'; mpScreen='home';
    await mpRefresh();
    if(game && game.phase==='draft') mpCpuAdvance();
  }
  render();
})();

// friends-league auto-refresh (skips while typing or syncing)
setInterval(()=>{
  if(mode!=='multi' || !game || syncing || mpLoading || !mpSession) return;
  try{ const ae=document.activeElement; if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')) return; }catch(e){}
  mpRefresh(true).then(ch=>{ if(ch){ if(game && game.phase==='draft') mpCpuAdvance(); render(); } });
}, 25000);
</script>
</body>
</html>
